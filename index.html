<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مفاجأة ليك 🎁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #ffffff;
      overflow: hidden;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 40px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 2;
    }
    .badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 800;
      margin-bottom: 18px;
    }
    h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 12px; line-height: 1.4; }
    p.subtitle { color: #cbd5e1; font-size: 1.05rem; margin-bottom: 30px; }
    .btn-main {
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      color: #fff;
      border: none;
      padding: 18px 36px;
      font-size: 1.35rem;
      font-weight: 900;
      font-family: 'Cairo', sans-serif;
      border-radius: 18px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.45);
      animation: pulse 2s infinite;
    }
    .btn-main:active { transform: scale(0.95); }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    #result-area { display: none; flex-direction: column; align-items: center; }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
    .maalesh-word {
      font-size: 4.5rem;
      font-weight: 900;
      background: linear-gradient(to right, #fde047, #fb923c, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      margin: 10px 0;
    }
    .sarcastic-msg { font-size: 1.2rem; color: #f8fafc; margin-bottom: 20px; min-height: 36px; }
    .counter-box {
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .counter-box span { color: #fbbf24; font-weight: 900; font-size: 1.1rem; }
    .actions { display: flex; gap: 10px; width: 100%; }
    .btn-again {
      flex: 2;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-share {
      flex: 1;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 14px;
      border-radius: 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }
    footer { margin-top: 26px; font-size: 0.95rem; color: rgba(255, 255, 255, 0.65); font-weight: 600; z-index: 2; }
    footer span { color: #fbbf24; font-weight: 800; }
    canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="card">
    <div id="start-area">
      <div class="badge">رسالة خاصة ليك ✨</div>
      <h1>في حاجة مهمة جداً مستنياك جوه!</h1>
      <p class="subtitle">دوس على الزرار اللي تحت عشان تشوفها 👇</p>
      <button class="btn-main" onclick="triggerMaalesh()">دوس هنا 🎁</button>
    </div>
    <div id="result-area">
      <div class="badge">النتيجة النهائية 😅</div>
      <div class="maalesh-word" id="maalesh-text">معلش يا نعمه !</div>
      <div class="sarcastic-msg" id="joke-text">تعيش وتاخد غيرها يا بطل 😂</div>
      <div class="counter-box">اتقالك معلش <span id="count">1</span> مرة</div>
      <div class="actions">
        <button class="btn-again" onclick="triggerMaalesh()">دوس تاني يمكن تتغير 🔄</button>
        <button class="btn-share" onclick="shareLink()">ابعتها لحد 📤</button>
      </div>
    </div>
  </div>
  <footer>بواسطة <span>محمد</span></footer>
  <script>
    let count = 0;
    const jokes = [
      "تعيش وتاخد غيرها يا بطل 😂",
      "ما هي الدنيا كده، هنعمل إيه 🤷‍♂️",
      "أهم حاجة الأخلاق والصحة ❤️",
      "شد حيلك، بكره تبقى أحسن (يمكن) 😅",
      "بتحصل في أحسن العائلات والله 🫂",
      "خد نفس عميق وكمل عادي 😌",
      "معلش تاني عشان شكلك محتاجها 😂",
      "خلاص يا عم متزعلش نفسك ✨"
    ];
    function playSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.35);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.08);
          osc.stop(ctx.currentTime + i * 0.08 + 0.35);
        });
      } catch (e) {}
    }
    function triggerMaalesh() {
      count++;
      document.getElementById('start-area').style.display = 'none';
      const resultArea = document.getElementById('result-area');
      resultArea.style.display = 'flex';
      resultArea.style.animation = 'none';
      resultArea.offsetHeight;
      resultArea.style.animation = 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
      document.getElementById('count').textContent = count;
      document.getElementById('joke-text').textContent = jokes[(count - 1) % jokes.length];
      playSound();
      launchConfetti();
    }
    function shareLink() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({ title: 'مفاجأة ليك 🎁', text: 'افتح اللينك ده ودوس على الزرار 👇', url: url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => alert('تم نسخ اللينك! ابعته لأي حد دلوقتي 🚀'));
      }
    }
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    function launchConfetti() {
      const colors = ['#fde047', '#fb923c', '#f43f5e', '#38bdf8', '#a855f7', '#34d399'];
      for (let i = 0; i < 65; i++) {
        particles.push({
          x: canvas.width / 2, y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)], life: 100
        });
      }
    }
    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.life -= 1.8;
        ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life / 100);
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(animateConfetti);
    }
    animateConfetti();
  </script>
</body>
</html>
